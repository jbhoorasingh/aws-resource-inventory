{% extends 'base.html' %}
{% load vue_tags %}

{% block title %}Task Status - AWS Resource Inventory{% endblock %}

{% block extra_css %}
{% vue_island 'tasks-island' %}
{% endblock %}

{% block content %}
<!-- Vue.js Tasks Island Mount Point -->
<div id="tasks-app"
     data-props='{}'
     data-csrf-token="{{ csrf_token }}">
    <!-- Loading state shown while Vue mounts -->
    <div class="flex flex-col items-center justify-center py-16">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-aws-orange mb-4"></div>
        <span class="text-gray-600">Loading tasks...</span>
    </div>

    <!-- Fallback content for non-JS browsers -->
    <noscript>
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-yellow-700">
                        JavaScript is required for the interactive task status view.
                        Please enable JavaScript or use a modern browser.
                    </p>
                </div>
            </div>
        </div>

        <!-- Basic static content for no-JS fallback -->
        <div class="text-center py-12">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Discovery Tasks</h2>
            <p class="text-gray-600 mb-4">
                Total Tasks: {{ total_tasks }} |
                Pending: {{ pending_count }} |
                Running: {{ running_count }} |
                Completed: {{ success_count }} |
                Failed: {{ failed_count }}
            </p>
            <a href="{% url 'accounts' %}" class="text-aws-orange hover:underline">
                Go to Accounts to start a new discovery
            </a>
        </div>
    </noscript>
</div>
{% endblock %}
