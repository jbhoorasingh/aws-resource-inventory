{% extends 'base.html' %}
{% load static vue_tags %}

{% block title %}Accounts - AWS Resource Inventory{% endblock %}

{% block content %}
<div id="accounts-app" data-props='{"canPoll": {{ can_poll|yesno:"true,false" }}}'>
  <!-- Loading state shown while Vue mounts -->
  <div class="flex flex-col items-center justify-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-aws-orange mb-4"></div>
    <p class="text-gray-600">Loading accounts...</p>
  </div>
</div>

{% vue_island 'accounts-island' %}
{% endblock %}
